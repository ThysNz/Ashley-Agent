<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ashley</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="app.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-mic" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-volume" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></symbol>
  <symbol id="i-terminal" viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z"/></symbol>
  <symbol id="i-cpu" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/><line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/></symbol>
  <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="15" y1="3" x2="15" y2="21"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></symbol>
</svg>

<div id="app">

  <header class="bar">
    <div class="brand"><span id="dot" class="dot" title="Model server status"></span><strong id="agent-name">Ashley</strong></div>
    <label class="field grow"><span>Model</span><select id="sel-model" aria-label="Model"></select></label>
    <label class="field grow"><span>Persona</span><select id="sel-persona" aria-label="Persona"></select></label>
    <label class="field grow"><span>Voice</span><select id="sel-voice" aria-label="Voice"></select></label>
    <div class="actions">
      <button class="icon" id="btn-chats" title="Saved chats" aria-label="Saved chats"><svg class="i"><use href="#i-clock"/></svg></button>
      <button class="icon" id="btn-new" title="New chat" aria-label="New chat"><svg class="i"><use href="#i-plus"/></svg></button>
      <button class="icon" id="btn-inspect" title="Inspect what is sent to the model" aria-label="Inspect"><svg class="i"><use href="#i-eye"/></svg></button>
      <button class="icon" id="btn-skills" title="Skills" aria-label="Skills"><svg class="i"><use href="#i-book"/></svg></button>
      <button class="icon" id="btn-models" title="Manage models" aria-label="Manage models"><svg class="i"><use href="#i-cpu"/></svg></button>
      <button class="icon" id="btn-panel" title="Show or hide the side panel" aria-label="Side panel"><svg class="i"><use href="#i-panel"/></svg></button>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <section class="meter" aria-label="Context window">
    <div class="meter-top">
      <span>Context window</span>
      <span id="meter-text" class="meter-text">&ndash;</span>
    </div>
    <div class="meter-bar" id="meter-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100">
      <div id="seg-system" class="seg system"></div>
      <div id="seg-tools" class="seg tools"></div>
      <div id="seg-notes" class="seg notes"></div>
      <div id="seg-history" class="seg history"></div>
    </div>
    <div class="legend" id="legend"></div>
  </section>

  <div class="layout" id="layout">

    <main class="chat">
      <div id="log" class="log" aria-live="polite"></div>

      <div id="toast" class="toast" hidden></div>

      <form id="composer" class="composer" autocomplete="off">
        <button type="button" id="mic" class="mic" data-mic aria-label="Hold to talk" title="Hold to talk (or hold the space bar)"><svg class="i"><use href="#i-mic"/></svg></button>
        <div class="input-wrap">
          <div id="slash" class="slash" hidden></div>
          <div id="level" class="level" hidden><div id="level-fill"></div><span id="level-time">0.0s</span></div>
          <textarea id="input" rows="1" placeholder="Message Ashley" aria-label="Message"></textarea>
        </div>
        <button type="submit" id="send" class="send" aria-label="Send"><svg class="i"><use href="#i-send"/></svg></button>
      </form>
      <div class="opts">
        <label><input type="checkbox" id="opt-speak"> Speak replies</label>
        <label><input type="checkbox" id="opt-auto"> Send after talking</label>
        <span id="mic-name" class="faint"></span>
        <span class="faint right">Hold the mic or the space bar (empty box) to talk &middot; Enter to send &middot; Esc to stop speech</span>
      </div>
    </main>

    <aside class="side" id="side">
      <section class="panel">
        <h3>Todo</h3>
        <div id="todo" class="plist"></div>
      </section>
      <section class="panel">
        <h3>Notes</h3>
        <div id="notes" class="plist"></div>
      </section>
      <section class="panel grow">
        <h3>Workspace</h3>
        <div id="crumb" class="crumb"></div>
        <div id="files" class="plist"></div>
      </section>
    </aside>

  </div>
</div>

<dialog id="dlg">
  <div class="dlg-head"><h2 id="dlg-title"></h2><button class="icon" id="dlg-close" aria-label="Close"><svg class="i"><use href="#i-x"/></svg></button></div>
  <div id="dlg-body" class="dlg-body"></div>
</dialog>

<script src="app.js"></script>
</body>
</html>
