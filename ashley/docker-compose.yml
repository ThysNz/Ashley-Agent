# Ashley - one agent. Run from this folder:
#   docker compose run --rm --build ashley          (or just double-click ashley.cmd)
#
# The model server is NOT in here: it runs on the host and the container
# reaches it through host.docker.internal (see config/models.json).
services:
  ashley:
    image: ai-agents/core:latest
    build:
      context: ..
      dockerfile: Dockerfile
    stdin_open: true
    tty: true
    extra_hosts:
      - "host.docker.internal:host-gateway"   # needed on Linux; Docker Desktop has it already
    environment:
      TZ: Pacific/Auckland
    volumes:
      - ./config:/agent/config:ro        # models.json, agent.json, personas
      - ./secrets:/agent/secrets:ro      # optional read-only GitHub token (see secrets/README.md)
      - ./skills:/agent/skills:ro        # this agent's own skills (folders with a SKILL.md)
      - ../skills:/agent/shared-skills:ro  # skills shared by every agent
      - ./workspace:/agent/workspace     # the only folder she can write on the host
      - ./memory:/agent/memory           # notes, todo, session logs, backups
      - ashley-home:/home/agent          # pip/npm/git settings survive restarts

  # HTTP API for the voice client. Start with:
  #   docker compose --profile server up -d server
  # Published on 127.0.0.1 only: the agent has a shell, so it must not be reachable from the network.
  server:
    image: ai-agents/core:latest
    profiles: ["server"]
    command: ["--serve"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Pacific/Auckland
      AGENT_PORT: "5000"
    volumes:
      - ./config:/agent/config:ro
      - ./secrets:/agent/secrets:ro
      - ./skills:/agent/skills:ro        # this agent's own skills (folders with a SKILL.md)
      - ../skills:/agent/shared-skills:ro  # skills shared by every agent
      - ./workspace:/agent/workspace
      - ./memory:/agent/memory
      - ashley-home:/home/agent

volumes:
  ashley-home:
